appId: ia.lousa.app
# nome que aparece no Windows (D45, D50); sem til nos arquivos (exe e instalador); o appId fica o mesmo para o instalador atualizar a Lousa.ia ja instalada
productName: Mãozinha
executableName: Maozinha
artifactName: Maozinha Setup ${version}.${ext}
directories:
  output: release
files:
  - out/**
  - package.json
# binarios e conpty.dll do node-pty precisam ficar fora do asar
asarUnpack:
  - node_modules/node-pty/**
win:
  target: nsis
  icon: build/icon.ico
  # sem assinatura digital por enquanto (sem certificado, o electron-builder pula a assinatura):
  # o hash do instalador vai em release/SHA256.txt. Ligado so para gravar icone e versao no .exe (D22).
  signAndEditExecutable: true
nsis:
  oneClick: true
  perMachine: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
# node-pty ja traz binarios prontos (prebuilds); nao ha compilador C++ no PC
npmRebuild: false
# R2.8: travas gravadas no Maozinha.exe. Sem ELECTRON_RUN_AS_NODE, NODE_OPTIONS nem --inspect, o exe
# instalado nao vira um Node que roda qualquer script; o codigo so vem do app.asar, conferido pela
# integridade gravada no exe. Os scripts do npm (dev, smoke, provas) usam o electron de node_modules,
# sem estas travas. O file:// mantem os privilegios extras: a tela do build carrega dele.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: true
